
name: TodoList CI CD to AWS ECR

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: todolist-app
  AWS_ACCOUNT_ID: "585142510670"

jobs:
  ci:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t todolist-app:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: todolist-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Save Docker image
        run: docker save todolist-app:${{ github.sha }} -o todolist.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: todolist-image
          path: todolist.tar
          retention-days: 1

  cd:
    name: Publish to Amazon ECR
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: todolist-image

      - name: Load Docker image
        run: docker load -i todolist.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::585142510670:role/GitHubActions-TodoList-ECR
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag todolist-app:$IMAGE_TAG $REGISTRY/todolist-app:$IMAGE_TAG
          docker tag todolist-app:$IMAGE_TAG $REGISTRY/todolist-app:latest
          docker push $REGISTRY/todolist-app:$IMAGE_TAG
          docker push $REGISTRY/todolist-app:latest
